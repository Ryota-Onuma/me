# -----------------------------------------------
# ■ 基本設定 (General)
# -----------------------------------------------

# プレフィックスキーを C-b から C-a に変更
unbind C-b
set-option -g prefix C-a
# C-a を2回押すと直前のウィンドウに切り替え
bind-key C-a last-window

# コピーモードのキーバインドをvi(Vim)スタイルにする
setw -g mode-keys vi

# 256色表示を有効にする
set -g default-terminal "screen-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# マウス操作を有効にする
set -g mouse on

# Escキーの遅延をなくす (Vimユーザー向け)
set -sg escape-time 0

# 履歴（スクロールバック）の行数を増やす
set -g history-limit 10000

# ウィンドウとペインのインデックスを 0 からではなく 1 から開始する
set -g base-index 1
setw -g pane-base-index 1

# -----------------------------------------------
# ■ キーバインド (Key Bindings)
# -----------------------------------------------

# 設定ファイルのリロード (Prefix + r)
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# --- ペイン分割 ---
# | で縦分割 (現在のパスを引き継ぐ)
bind | split-window -h -c "#{pane_current_path}"
# - で横分割 (現在のパスを引き継ぐ)
bind - split-window -v -c "#{pane_current_path}"

# --- ペイン移動 (Vimライク) ---
# Prefix + h/j/k/l でペイン間を移動
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- ペインのリサイズ (Vimライク) ---
# Prefix + H/J/K/L でペインをリサイズ
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- ウィンドウ操作 ---
# Prefix + c で新しいウィンドウ (現在のパスを引き継ぐ)
bind c new-window -c "#{pane_current_path}"

# -----------------------------------------------
# ■ ステータスバー (Status Bar)
# -----------------------------------------------

# ステータスバーを有効にする
set -g status on

# 更新間隔 (秒)
set -g status-interval 1

# 配置 (左 | 中央 | 右)
set -g status-justify "left"

# --- 色設定 ---
set -g status-bg "colour154" # 背景 (黄緑)
set -g status-fg "colour255" # 文字 (白)

# --- 左側 (セッション名 + Prefix待機表示) ---
set -g status-left-length 60
set -g status-left "#[fg=colour111,bg=colour238,bold] SESSION: #S #[default] #[fg=cyan,bold]#{?client_prefix, [PREFIX],}#[default]"

# --- 中央 (ウィンドウリスト) ---
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=colour235,bg=colour255,bold] #I:#W #[default]"

# --- 右側 (モード表示 + 日付・時刻) ---
set -g status-right-length 100
set -g status-right "#[fg=yellow,bold]#{?pane_in_mode, [COPY MODE],}#[default] #[fg=colour245] %Y/%m/%d(%a) %H:%M #[default]"

# -----------------------------------------------
# ■ プラグイン (tpm: Tmux Plugin Manager)
# -----------------------------------------------
# ※ tpm自体を先にインストールする必要があります:
# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm

# tmux-yankがうまく動かない場合の手動フォールバック
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "tmux save-buffer - | reattach-to-user-namespace pbcopy"

# プラグインリスト
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'       # Vimライクなコピー

# tpm の初期化 (必ず設定ファイルの最後に記述する)
run '~/.tmux/plugins/tpm/tpm'