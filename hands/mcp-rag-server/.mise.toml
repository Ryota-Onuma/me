[tools]
[tasks."project:show"]
description = "現在のPROJECTを表示"
run = '''
bash -c 'set -e; if [ -f .env ]; then export $(grep -v '^#' .env | xargs); fi; echo PROJECT=${PROJECT:-default}'
'''

[tasks."project:init"]
description = "プロジェクト初期化（設定JSON+スキーマ作成）"
run = '''
bash -lc '
set -e
# .envの読み込み
if [ -f .env ]; then export $(grep -v '^#' .env | xargs); fi

# DB起動/待機
if [ -z "$(docker compose ps -q postgres 2>/dev/null)" ]; then
  docker compose up -d postgres
fi
echo "⏳ Postgresの起動を待機..."
ok=""
for i in $(seq 1 30); do
  if docker compose exec -T postgres pg_isready -U "${POSTGRES_USER:-postgres}" -d "${POSTGRES_DB:-ragdb}" >/dev/null 2>&1; then
    ok=1; break
  fi
  sleep 1
done
[ -n "$ok" ] || { echo "Postgres が準備できていません" >&2; exit 1; }

NAME_ARG=${NAME:+--name "$NAME"}
if [ -n "$NAME" ]; then
  SRC_ARG="--source-dir /app/data/source/$NAME"
  PROC_ARG="--processed-dir /app/data/processed/$NAME"
else
  SRC_ARG=""
  PROC_ARG=""
fi

# 対話タスクのためTTY付き run を使用
docker compose run --rm mcp-server \
  uv run python -m src.cli project init $NAME_ARG $SRC_ARG $PROC_ARG
' 
'''

# --- Convenience aliases -----------------------------------------------------

[tasks."rag:inc"]
description = "増分インデックスを実行（.envのPROJECT既定、-d等で上書き可）"
run = '''
bash -c '
set -e
# .envの読み込み
if [ -f .env ]; then export $(grep -v '^#' .env | xargs); fi
PROJECT=${PROJECT:-alpha}
SIZE=${SIZE:-500}
OVERLAP=${OVERLAP:-100}
DIR=${DIR:-/app/data/source/${PROJECT}}
echo "🔁 (incremental) プロジェクト: $PROJECT をインデックス化..."
# DB起動/待機
if [ -z "$(docker compose ps -q postgres 2>/dev/null)" ]; then docker compose up -d postgres; fi
ok=""; for i in $(seq 1 30); do
  if docker compose exec -T postgres pg_isready -U "${POSTGRES_USER:-postgres}" -d "${POSTGRES_DB:-ragdb}" >/dev/null 2>&1; then ok=1; break; fi; sleep 1; done
[ -n "$ok" ] || { echo "Postgres が準備できていません" >&2; exit 1; }

docker compose run --rm -T mcp-server \
  uv run python -m src.cli --project "$PROJECT" index -d "$DIR" -s "$SIZE" -o "$OVERLAP" -i
'
'''

[tasks."rag:inc:select"]
description = "プロジェクトを対話選択して増分インデックス"
run = '''
bash -lc '
set -e
P=$(mise run -q project:choose)
SIZE=${SIZE:-500}
OVERLAP=${OVERLAP:-100}
DIR=${DIR:-/app/data/source/${P}}
echo "🔁 (incremental) プロジェクト: $P をインデックス化..."
# DB起動/待機
if [ -z "$(docker compose ps -q postgres 2>/dev/null)" ]; then docker compose up -d postgres; fi
ok=""; for i in $(seq 1 30); do
  if docker compose exec -T postgres pg_isready -U "${POSTGRES_USER:-postgres}" -d "${POSTGRES_DB:-ragdb}" >/dev/null 2>&1; then ok=1; break; fi; sleep 1; done
[ -n "$ok" ] || { echo "Postgres が準備できていません" >&2; exit 1; }

docker compose run --rm -T mcp-server \
  uv run python -m src.cli --project "$P" index -d "$DIR" -s "$SIZE" -o "$OVERLAP" -i
'
'''

