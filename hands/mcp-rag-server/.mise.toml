[tasks."mcp:start"]
description = "MCPサーバー起動（PROJECTをENVまたは引数で指定）"
run = '''
bash -lc '
set -e
NAME=${NAME:-mcp-rag-server}
DESC=${DESC:-MCP RAG Server}
PROJECT=${PROJECT:-alpha}
echo "🚀 プロジェクト: $PROJECT でMCPサーバーを起動します..."
# run 運用（TTYで前面起動）
docker compose run --rm mcp-server uv run python -m src.main --name "$NAME" --description "$DESC" --project "$PROJECT"
'
'''

